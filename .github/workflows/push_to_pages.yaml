name: Deploy AMSA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout amsa-slides
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Build main AMSA website
      # -------------------------
      - name: Build AMSA slides
        run: nix build

      - name: Copy AMSA website
        run: |
          mkdir -p site
          cp -rL result/. site/

      # -------------------------
      # Build amsatop docs
      # -------------------------
      - name: Checkout amsatop
        uses: actions/checkout@v4
        with:
          repository: El-Despatx/amsatop
          path: amsatop

      - name: Build amsatop documentation
        working-directory: amsatop
        run: nix build

      - name: Add amsatop documentation
        run: |
          mkdir -p site/docs
          cp -rL amsatop/result/. site/docs/

      # -------------------------
      # Deploy combined website
      # -------------------------
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4